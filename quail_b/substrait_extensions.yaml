%YAML 1.2
---
urn: extension:org.fsdatalab.quail_b:functions_ai
scalar_functions:
  - name: ai_filter
    description: Return whether a document satisfies a natural-language prompt.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: document
            value: string
        return: boolean
  - name: ai_join
    description: Return whether two documents satisfy a natural-language prompt.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: left
            value: string
          - name: right
            value: string
        return: boolean
  - name: ai_score
    description: >-
      Return the model's belief that a document satisfies a
      natural-language prompt, between 0 and 1: the probability of the
      TRUE answer over the TRUE and FALSE answers.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: document
            value: string
        return: fp64
  - name: ai_extract
    description: >-
      Return the words of a document that answer a question, copied
      from the document, or null when the document does not answer it.
    impls:
      - args:
          - name: question
            value: string
            constant: true
          - name: document
            value: string
        return: string?
  - name: ai_sae_features
    description: >-
      Return the sparse autoencoder (SAE) features of a prompt over a
      document as a list of (feature, strength) pairs, the nonzero
      features only. The pooling says which tokens become the list:
      'last' reads the final prompt token; 'max' takes each feature's
      largest strength over every prompt token.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: document
            value: string
          - name: pooling
            description: "'last' or 'max'."
            value: string
            constant: true
        return: list<struct<i32,fp32>>
  - name: ai_classify
    description: >-
      Return the label the model scores highest for a document, or for a
      pair of documents, from a fixed list of labels. A label's score is
      the sum of its tokens' log probabilities after the prompt; the
      earlier label wins a tie.
    impls:
      - args:
          - name: prompt
            value: string
            constant: true
          - name: document
            value: string
          - name: labels
            value: list<string>
            constant: true
          - name: descriptions
            description: One per label; an empty string means no description.
            value: list<string>
            constant: true
        return: string
      - args:
          - name: prompt
            description: Names the first document as {0} and the second as {1}.
            value: string
            constant: true
          - name: document
            description: The anchor, placed first in the prompt.
            value: string
          - name: document
            description: The partner, placed after the anchor.
            value: string
          - name: labels
            value: list<string>
            constant: true
          - name: descriptions
            description: One per label; an empty string means no description.
            value: list<string>
            constant: true
        return: string
